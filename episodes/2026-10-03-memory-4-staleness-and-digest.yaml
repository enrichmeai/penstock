decided:
- what: a null verified-against.tag fails; a tag behind the newest release warns STALE and stays green
  why: a missing tag is a broken promise, an old tag is a question for the owner
- what: the weekly workflow keeps exactly one pattern-stale issue open and closes it when green
  why: one place to look, no second inbox; the same shape the site's release sync uses
- what: GET /api/audit/patterns lists never-loaded patterns last and returns 503 through ErrorAdvice in
    memory storage
  why: pruning is a reading of one table; an error response is a @SafeMessage exception plus a handler,
    never a hand-built map
refused:
- what: owner-scoping the per-pattern aggregate
  why: it names pattern ids and counts, never content; a single-owner instance does not need the split
    yet
learned:
- with python3 - <<heredoc the heredoc is stdin, so a pipe into it is never read; pass data as an argument
- gh --jq '.[0].number' prints the literal null on an empty list; use // empty before testing for emptiness
- the builder's headless Bash allowlist only pre-approves specific prefixes; a bare python3 -c or curl
  prompts and fails, so wrap one-offs in scripts/*.sh
- the builder hit the 200-turn cap after finishing the code and the review round, before opening the PR
open:
- 'the reviewer''s round-two verdict was produced inside the run and never posted; the measure on #78
  counts it as not on record'
