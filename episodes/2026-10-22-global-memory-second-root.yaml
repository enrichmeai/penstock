decided:
- what: global memory is a second root set by agent.memory.global-root, read below the owner's root, so the owner's pattern with the same id wins
  why: the narrower tier wins (owner, 2026-10-21); a separate public repository is versioned and usable without Penstock
- what: only public cards load from it, and no symbolic link in it is followed
  why: it is a third-party checkout changed by PR; a link to a credentials file would otherwise reach the prompt
- what: 'the stack key in memory.yaml picks one layer per category, a declared project''s own stack winning; an unreadable memory.yaml loads no global layer'
  why: layers compose instead of one pattern per combination; failing closed keeps an unknown stack from loading everything
refused:
- what: uses [global] in memory.yaml as the switch
  why: the config key is enough for the first slice; noted in docs/memory-root.md
- what: a vector store for selecting memory
  why: selection stays deterministic and explainable (#85 invariant 4); a code-search index may be measured later under #141
learned:
- penstock's pattern.schema.json allows no extra manifest keys, so a pattern's sources live in global-memory's own sources.yaml
open:
- staleness of a global pattern is still measured against Penstock's release tag, not the tool versions in its verified-against
- memory.yaml is parsed twice per reload (a doubled warning for an invalid project entry)
