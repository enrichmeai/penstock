project: penstock
asked: 'Context compaction: summarise older turns when history nears the token budget, keep recent turns
  verbatim, audit each compaction'
issue: enrichmeai/penstock#173
built:
- pr: enrichmeai/penstock#181
  merged: 3655af2
  files:
  - README.md
  - src/main/java/com/example/agent/config/AgentProperties.java
