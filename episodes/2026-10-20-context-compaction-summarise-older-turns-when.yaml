decided:
- what: compaction folds older turns into one summary carried in the system prompt; the stored history is never changed
  why: the transcript stays the user's words and the model's, as for memory recall
- what: a failed or empty summary sends the request unfolded and is not retried for the rest of that request
  why: a provider that is down would otherwise cost one failed call per loop iteration
- what: the summary is re-made on every request rather than stored on the session
  why: storing it needs a session-schema change; left for the owner to decide
refused:
- what: a real tokenizer for the estimate
  why: characters divided by four, with the 0.6 threshold leaving room, is enough until measured otherwise
learned:
- a context window may start only after a complete assistant tool call and its result, never with an orphan tool message
