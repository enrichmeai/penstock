decided:
- what: pin jdtls milestone 1.63.0 by sha256, cached on that hash
  why: snapshots are pruned from download.eclipse.org, and a pinned hash refuses a changed download
- what: jdtls runs on Java 25 through the launcher's --java-executable (JDTLS_JAVA), Gradle stays on 21
  why: jdtls 1.63 needs Java 25, the project builds on 21
- what: the CI step fails unless the report shows 3 run and 0 skipped
  why: a skipped test must never read as a pass
refused:
- what: retrying the diagnostics call until an error shows
  why: it would hide a real early answer; a warm-up definition call waits for the project import instead
learned:
- 'jdtls 1.63.0 and the 1.64.0 snapshot both need Java 25: 14 OSGi bundles require osgi.ee JavaSE 25, and on Java 21 the server exits before answering initialize.'
- 'jdtls takes a loose file''s own folder as its source root, so a file under src/demo/ with package demo gets a package-mismatch error; test fixtures sit at the root in the default package.'
- 'Gradle does not treat environment variables as test inputs: a run with only JDTLS_HOME changed is UP-TO-DATE and leaves the old report; use --rerun.'
- 'A filtered --rerun replaces build/test-results/test (87 files became 1), so it runs after the suite''s report upload and uploads its own.'
open:
- 'The step has not yet run on a GitHub runner; PR #205''s CI is its first run.'
- '#190 still open: the symbol argument and the measure on a real repo.'
