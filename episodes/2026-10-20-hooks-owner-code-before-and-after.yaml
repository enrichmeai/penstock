decided:
- what: a pre-tool hook runs only after the tool policy allowed the call, and can only deny
  why: hooks make the policy stricter, never looser
- what: a failing pre-tool hook denies; post-tool and turn hooks fail open
  why: a broken guard must not let a call through
- what: a hook gets PATH, HOME, LANG and PENSTOCK_HOOK_EVENT only, not Penstock's environment
  why: shell inherits the whole environment, credentials included; hooks need none of it
refused:
- what: hooks loaded from the workspace, and remote webhooks
  why: a repository must not be able to install code that runs on the owner's machine
learned:
- a process's children must be seen while it runs and killed when it ends; after the parent exits, descendants() no longer finds an orphan
- where PID 1 does not reap, a killed orphan stays a zombie and ProcessHandle still reports it alive
open:
- a hook that backgrounds a child and exits at once can leave it running; documented and tested as failing closed
- consider init true in docker-compose so orphaned hook children are reaped
