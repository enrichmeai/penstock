decided:
- what: count every test case, and list a failure followed by a passing entry with the same name, with a note
  why: a report cannot tell a retry from two tests sharing a name (a parameterised case, a DisplayName); hiding the failure reads a red build as green
- what: frames outside the JDK and the test libraries, with loader and module prefixes stripped
  why: real Gradle frames read app//org.junit... and java.base@21/..., so prefix matching on the raw text showed JUnit's frames and dropped the test's line
- what: the fixture is a real Gradle report, not a hand-written one
  why: the hand-written fixture had no app// prefixes and used error, which Gradle never writes, so it could not catch either defect
refused:
- what: deduplicating reruns by class and name, last result wins
  why: it turned real failures into passes; Gradle's mergeReruns and Maven's flakyFailure already merge real retries
learned:
- Gradle writes every exception as a failure, never an error; only Maven's surefire reports separate errors
- Gradle's XML frames carry the class loader and module (app//, java.base@21.0.10/) because traces cross the test worker by serialisation
- a pairwise scan for a later passing entry is quadratic; 30,000 failures took 30 s, a map of last passes made 50,000 take 0.47 s
open:
- feeding this summary to verify when the configured check fails (#189, not built)
- the real path is checked just before a report is opened, not atomically with the open
