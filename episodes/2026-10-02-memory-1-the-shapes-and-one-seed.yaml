decided:
- what: 'three folders with a README each: requests/, references/, patterns/'
  why: a card is a file a person can read, diff and review by PR; no database, no service
- what: verified-against names a release tag, never a branch or a main commit
  why: a pattern is only as trustworthy as the release it was last checked against
- what: a pattern enters only with a passing check.sh, and the skeleton compiles against the real SDK
    jars
  why: a skeleton that does not compile is folklore, not memory
refused:
- what: a schema registry or JSON Schema for the cards
  why: check-cards.sh with a few rules is enough at this size; a schema would be a second thing to keep
    in step
- what: embedding search over the cards
  why: keyword triggers and file signatures are inspectable; a ranking nobody can read is not
