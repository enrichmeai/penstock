- what: the language server gets PATH, HOME and LANG plus named variables only, and its process tree is killed on close or a failed start
  why: it is a third-party process in the workspace; review found it inheriting Penstock's model keys and leaking on a slow initialize
- what: diagnostics are matched to the version of the file just synced
  why: a busy server can publish for the previous version after an edit, which would report fixed errors as still there
refused:
- what: claiming jdtls works
  why: Eclipse's download site was in a temporary shutdown, so the slice is tested against a scripted LSP server only
learned:
- a leak test that searched processes by command line passed even with the cleanup removed; counting the test JVM's live children catches it
