decided:
- what: the plan travels in ToolContext, not a registry keyed by session id
  why: two turns on one session hold different Session objects under the database store; a registry keyed by id let one overwrite the other
- what: the plan is shown in every call's system prompt as the agent's own notes, flattened to one line per step
  why: model-written text must not gain system authority or forge a heading
refused:
- what: an integration test through the SQLite store for the continued session
  why: covered in pieces (AgentService-level continuation, JPA round trip, real migrations); the deviation is on the PR for the owner
learned:
- the SQLite integration tests build their schema with Flyway off, so no test ran the migrations until
  SqliteMigrationsTest
open:
- the Postgres V5 migration was not run here (its test needs Docker)
- two concurrent turns on a database store keep the last plan saved
