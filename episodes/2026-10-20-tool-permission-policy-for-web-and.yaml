decided:
- what: no policy entry means allow, so the default leaves every tool as it was
  why: the issue asked for the defaults to keep behaviour exactly
- what: in ACP mode ask goes to the editor's own permission prompt, and an approval there covers that call's gate check once
  why: one policy model for web and ACP, and no double prompt
- what: two spellings of one tool with different policies fail at startup
  why: a deny silently overridden by an allow is the failure a policy exists to stop
refused:
- what: always-allow memory in web mode, and per-user or per-session overrides
  why: out of the first slice
learned:
- Spring drops characters other than letters, digits, '-' and '.' from an unbracketed map key, and an environment variable turns '_' into '.', so map keys are compared normalised
- a binding test that stands for environment variables needs a property source named systemEnvironment, or the env-name mapping never applies
- a wrapper's per-call memory must be cleared when the call ends, not when a downstream check happens to run, or it outlives the call
open:
- no cross-user integration test of the approval endpoints; ownership rests on requireSession's 404
