decided:
- what: one ContextAssembler call before the model loop, from the user input only, never from the transcript
  why: the block must be the same for the same input on any day; the transcript varies
- what: at most three patterns and a 12 000-character cap, dropping whole entries from the end
  why: a truncated skeleton is worse than none; a bounded block keeps the prompt predictable
- what: agent.memory.enabled defaults to false
  why: these folders are this project's own build memory, not every deployment's
- what: every load is a pattern.loaded audit event and an INFO line
  why: the ACP mode has no audit store, so the log line is the trail there
refused:
- what: walking the workspace once per signature glob
  why: one walk per assemble() is enough and an UncheckedIOException must not abort the turn
learned:
- a test that asserts over patterns/ content must point agent.memory.root at an isolated fixture, not
  this repo's own folder
- memory-mode tests pass vacuously unless they replicate main()'s autoconfigure exclusions
open:
- retrieval reads the local folder only; a hosted session cannot see the store yet
patterns:
- stdio-json-rpc-agent
