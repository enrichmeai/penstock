plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
// The release workflow overrides this from the git tag: -PreleaseVersion=1.2.3
version = findProperty('releaseVersion') ?: '0.5.1'

// Targeted overrides on top of the Boot 3.5.16 BOM, for what the v0.5.0 image scan lists
// with a fix (#120). Remove each one when a Boot BOM managing that version or later is adopted.
// Tomcat 10.1.55: CVE-2026-65182, CVE-2026-65905, CVE-2026-68525 (critical), fixed in 10.1.58.
ext['tomcat.version'] = '10.1.60'
// Netty 4.1.135: CVE-2026-75595 (critical) fixed in 4.1.137; codec, codec-http and codec-http2 highs
// (CVE-2026-59901, -55831, -55833, -56745, -56819) in 4.1.136.
ext['netty.version'] = '4.1.139.Final'
// Jackson 2.21.4: CVE-2026-68497, CVE-2026-89407, CVE-2026-89425, CVE-2026-91776, CVE-2026-91777 (high), fixed in 2.21.7.
ext['jackson-bom.version'] = '2.21.7'
// PostgreSQL driver 42.7.11: CVE-2026-54291 (high), fixed in 42.7.12.
ext['postgresql.version'] = '42.7.14'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'   // WebClient for LLM calls
    implementation 'org.springframework.boot:spring-boot-starter-security'  // HTTP Basic + OIDC
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client' // GitHub / Google / Okta SSO
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server' // JWT bearer auth
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'  // SQLite/Postgres persistence

    // SQLite driver + Hibernate community dialect (dev/local default)
    runtimeOnly   'org.xerial:sqlite-jdbc:3.53.4.0'
    implementation 'org.hibernate.orm:hibernate-community-dialects:6.6.56.Final'

    // Postgres driver (production) — version managed by the Boot BOM, currently
    // overridden in the block at the top (#120) until the BOM catches up.
    runtimeOnly   'org.postgresql:postgresql'

    // OpenAPI / Swagger UI at /swagger-ui.html
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.9.0'

    // Phase 1 safety: rate limiting + bucket cache + migrations
    implementation 'com.bucket4j:bucket4j-core:8.10.1'
    implementation 'com.github.ben-manes.caffeine:caffeine:3.2.4'
    implementation 'org.flywaydb:flyway-core'
    // Flyway 10+ moved per-vendor support into separate modules. Required for
    // Postgres because flyway-core no longer ships the Postgres parser.
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'

    // Phase 2 operability: metrics + JSON logs
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'net.logstash.logback:logstash-logback-encoder:7.4'

    // JSON
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    // Utilities
    implementation 'org.apache.commons:commons-lang3:3.20.0'
    implementation 'commons-io:commons-io:2.22.0'

    // Lombok (optional but handy)
    compileOnly 'org.projectlombok:lombok:1.18.46'
    annotationProcessor 'org.projectlombok:lombok:1.18.46'
    testCompileOnly 'org.projectlombok:lombok:1.18.46'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.46'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly   'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly   'com.h2database:h2'

    // Testcontainers — Postgres integration tests (real DB, real migrations)
    testImplementation 'org.testcontainers:postgresql:1.21.4'
    testImplementation 'org.testcontainers:junit-jupiter:1.21.4'

    // MockWebServer — provider streaming + non-streaming wire tests
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'

    implementation 'com.agentclientprotocol:acp-agent-support:0.18.0'
    // MCP stdio mode (#116): the official MCP Java SDK at the version Cistern's cistern-mcp uses.
    // mcp-core plus the Jackson 2 JSON module, not the `mcp` bundle: that one brings Jackson 3, and
    // Spring Boot 3.5 runs on Jackson 2.
    implementation 'io.modelcontextprotocol.sdk:mcp-core:2.0.0'
    implementation 'io.modelcontextprotocol.sdk:mcp-json-jackson2:2.0.0'
}

tasks.named('test') {
    useJUnitPlatform()
}

bootRun {
    // Let the user override workspace dir from the CLI: ./gradlew bootRun --args='--agent.workspace=/path'
    systemProperty 'spring.profiles.active', System.getProperty('spring.profiles.active', 'default')
}

springBoot {
    // Exposes version/artifact at /actuator/info so a deployed instance can say
    // what it is. Excluding time keeps the build reproducible (and cacheable).
    buildInfo {
        excludes = ['time']
    }
}
