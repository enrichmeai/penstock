server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: penstock
  lifecycle:
    timeout-per-shutdown-phase: 30s
  mvc:
    async:
      request-timeout: 600000

  # OAuth2 / OIDC providers for browser-based login are wired in
  # OAuthClientConfig. A provider is registered only if its env vars are set
  # (e.g. GITHUB_OAUTH_CLIENT_ID + GITHUB_OAUTH_CLIENT_SECRET). With nothing
  # set, only HTTP Basic is active. See README for callback URL patterns.

  # JPA is configured at runtime by AgentApplication only when
  # agent.storage.type ∈ {sqlite, postgres}. The dialect is set per profile
  # below (storage-sqlite / storage-postgres) so we don't lock in SQLite here.
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none            # Flyway owns the schema
    properties:
      hibernate:
        show_sql: false

  flyway:
    enabled: false              # enabled only under storage-sqlite profile below
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true           # exposes /actuator/health/liveness + /readiness
      show-details: when_authorized
      group:
        liveness:
          include: livenessState
        readiness:
          # No db here: in memory mode (the default) there is no DataSource, and
          # a group member that doesn't exist aborts startup. The storage-sqlite
          # and storage-postgres profile documents below add db back — exactly
          # the modes where a DataSource is guaranteed.
          include: readinessState,llmProvider
  metrics:
    tags:
      application: ${spring.application.name}

agent:
  workspace: ${AGENT_WORKSPACE:${user.dir}/agent-workspace}

  storage:
    type: ${AGENT_STORAGE_TYPE:memory}
    sqlite-path: ${AGENT_SQLITE_PATH:./data/agent.db}

  auth:
    # Secure by default — see AgentProperties.Auth. Opt out explicitly for
    # local experiments with AGENT_AUTH_ENABLED=false.
    enabled: ${AGENT_AUTH_ENABLED:true}
    # basic | oidc | disabled
    mode: ${AGENT_AUTH_MODE:basic}
    # ---- Basic-mode (legacy / transitional) ----
    username: ${AGENT_AUTH_USERNAME:admin}
    # No shipped default: unset (or the historical "change-me") means a random
    # password is generated and logged at startup — see SecurityConfig.
    password: ${AGENT_AUTH_PASSWORD:}

  cors:
    # Comma-separated origins granted CORS WITH credentials; "*" allows any
    # origin WITHOUT credentials; empty (default) = no cross-origin access.
    # The bundled UI is served same-origin and needs none of this.
    allowed-origins: ${AGENT_CORS_ALLOWED_ORIGINS:}
    # ---- OIDC-mode (production) ----
    oidc:
      issuer-uri:       ${AGENT_OIDC_ISSUER_URI:}
      audience:         ${AGENT_OIDC_AUDIENCE:}
      principal-claim:  ${AGENT_OIDC_PRINCIPAL_CLAIM:sub}
      clock-skew-seconds: ${AGENT_OIDC_CLOCK_SKEW_SECONDS:30}

  sse:
    core-pool-size: 4
    max-pool-size: 16
    queue-capacity: 32
    # Send a comment-frame heartbeat to every active SSE emitter on this
    # interval so idle proxies/load balancers don't drop long-running streams
    # (LLM calls and shell tools can exceed a 30-60s proxy idle timeout).
    # Set to 0 (PT0S) to disable. See docs/adr/0002-multi-instance-sse.md.
    heartbeat-interval: ${AGENT_SSE_HEARTBEAT_INTERVAL:15s}

  metrics:
    # Scraping /actuator/prometheus without credentials while auth is enabled.
    # Default false: metric labels leak tool names, providers, token counts and
    # request rates. Set true only where the scraper cannot authenticate and the
    # port is network-restricted. /actuator/health/** is always open regardless.
    public-scrape: ${AGENT_METRICS_PUBLIC_SCRAPE:false}

  rate-limit:
    enabled: ${AGENT_RATE_LIMIT_ENABLED:true}
    chat:
      capacity: 30
      refill-tokens: 30
      refill-period: 1m
    api:
      capacity: 300
      refill-tokens: 300
      refill-period: 1m

  llm:
    provider: ${AGENT_LLM_PROVIDER:copilot}
    # Measured against a real repository (docs/real-repo-validation.md): a search
    # took 2 turns and a single-file edit 5, but a two-file change with a test hit
    # the old cap of 10 having produced nothing. After the list_dir fix the same
    # task completed its edits in ~11 turns — and then stopped on the TOKEN budget,
    # not the turn cap, at ~54k. Raising turns alone would have changed nothing,
    # so both move together; roughly 4-5k tokens per turn against a real repo.
    max-turns-per-request:  ${AGENT_LLM_MAX_TURNS_PER_REQUEST:25}
    max-tokens-per-request: ${AGENT_LLM_MAX_TOKENS_PER_REQUEST:150000}
    max-tokens-per-session: ${AGENT_LLM_MAX_TOKENS_PER_SESSION:600000}
    # Per-token streaming from the LLM to the SSE endpoint. See ADR 0003.
    streaming-enabled: ${AGENT_LLM_STREAMING_ENABLED:true}
    system-prompt: |
      You are an expert AI coding agent. You help the user explore and modify
      their codebase. You have access to tools that let you read files, edit
      files, run shell commands, search code, and use git. ALWAYS prefer
      reading a file before editing it. Keep responses concise. Explain your
      plan briefly before taking multi-step actions.

      Tests are specifications, not obstacles. When a test fails, first decide
      which is wrong — the test or the code — and say which you concluded and
      why. Never change production code merely to satisfy an assertion you
      believe is incorrect, and never weaken or delete an assertion to make it
      pass; if a test looks wrong, report it to the user instead of coding
      around it. A green suite you obtained by bending the code to a broken
      test is a failure you have hidden, not work you have finished.
    context:
      policy: last-n            # none | last-n
      last-n: 50

    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      base-url: https://api.anthropic.com
      model: claude-sonnet-4-5
      max-tokens: 4096

    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: https://api.openai.com
      model: gpt-4o
      max-tokens: 4096

    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      # Must be a model whose Ollama template emits structured `tool_calls`.
      # The qwen2.5-coder family advertises `tools` but returns the call as fenced
      # JSON in `content`, which the tool-use loop cannot see. Verified working:
      # llama3.2:3b (2GB), qwen3-coder:30b (18GB).
      model: ${OLLAMA_MODEL:llama3.2:3b}
      # Sent as options.num_ctx. Without it Ollama falls back to its own default
      # (measured: 2050 in the bundled container, 4096 on host 0.12.11) and silently
      # discards the overflow — the system prompt and tool schemas go first. A bare
      # first turn already measures ~1.6k tokens and one tool result can add ~4k.
      # 0 omits the option entirely so a server-side OLLAMA_CONTEXT_LENGTH can win.
      num-ctx: ${OLLAMA_NUM_CTX:16384}

    copilot:
      api-key: ${GITHUB_COPILOT_TOKEN:${GITHUB_TOKEN:}}
      base-url: ${COPILOT_BASE_URL:https://api.githubcopilot.com}
      model: ${COPILOT_MODEL:gpt-4o}
      max-tokens: 4096

  tools:
    max-output-bytes: 16384
    shell:
      enabled: ${AGENT_TOOLS_SHELL_ENABLED:true}
      # A first build in a fresh workspace (compile + tests) takes minutes, and a
      # command that keeps printing holds the turn until it finishes, so 60s made
      # './gradlew test' impossible. The model can still pass timeout_seconds.
      timeout-seconds: ${AGENT_TOOLS_SHELL_TIMEOUT_SECONDS:600}
      blocked-patterns:
        - "^\\s*rm\\s+-rf\\s+/"
        - "^\\s*:\\(\\)\\{"
        - "mkfs"
        - "dd\\s+if="
        # Expanded: common exfiltration / lateral movement vectors
        - "(?i)\\bcurl\\b"
        - "(?i)\\bwget\\b"
        - "(?i)\\bnc\\b"
        - "(?i)\\bncat\\b"
        - "(?i)\\bssh\\b"
        - "(?i)\\bscp\\b"
        - "(?i)\\brsync\\b"
        - "(?i)\\bftp\\b"
        - "(?i)\\bnohup\\b"
        - "(?i)/etc/shadow"
        - "(?i)~/\\.ssh"
      # Opt-in allow-list. Empty = permissive (block-list only). Populate in prod:
      # allowed-commands: [ls, cat, rg, grep, find, head, tail, wc, git, ./gradlew]
      allowed-commands: []
    file:
      enabled: true
      max-bytes: 1048576
    jira:
      base-url: ${JIRA_BASE_URL:}
      token: ${JIRA_API_TOKEN:}

    # The agent's own pod. Blank disables the tool.
    # By default the credential is this agent's, not its user's: the pod resolves it
    # to this application's WebID, so a grant to the agent is a grant to it alone.
    cistern:
      base-url: ${CISTERN_BASE_URL:}
      token: ${CISTERN_AGENT_TOKEN:}
      # Whose credential the pod sees — service | per-user | forward
      # (CredentialMode). Env: AGENT_TOOLS_CISTERN_CREDENTIALMODE.
      credential-mode: service

  # Per-user outbound credentials — none provisioned by default. Property form keeps
  # the user id verbatim (bracket it if it contains '@' or similar); the env form
  # lower-cases it, cannot express '@' or '-', and the prefix must be PERUSER:
  #   agent.credentials.per-user.openai.alice: sk-...      (gateway key for alice)
  #   AGENT_CREDENTIALS_PERUSER_OPENAI_ALICE=sk-...        (same, from the environment)
  #   agent.credentials.per-user.cistern.alice: ...        (with credential-mode: per-user)

logging:
  level:
    com.example.agent: INFO

---
spring:
  config:
    activate:
      on-profile: storage-sqlite
  datasource:
    url: jdbc:sqlite:${agent.storage.sqlite-path}?journal_mode=WAL&busy_timeout=10000
    driver-class-name: org.sqlite.JDBC
    hikari:
      # SQLite permits exactly one writer. The agent loop persists messages on the
      # request thread while AuditLogger writes audit_events from another, so a
      # multi-connection pool deadlocks the two against each other and the second
      # writer dies with SQLITE_BUSY mid-conversation. One connection serialises
      # them; WAL + busy_timeout above cover any remaining contention.
      maximum-pool-size: 1
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
  flyway:
    enabled: true
    locations: classpath:db/migration/sqlite
    # SQLite doesn't support transactional DDL — disable it.
    group: false
    out-of-order: false

management:
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,db,llmProvider

---
spring:
  config:
    activate:
      on-profile: storage-postgres
  datasource:
    url:      ${AGENT_DB_URL:jdbc:postgresql://localhost:5432/agent}
    username: ${AGENT_DB_USER:agent}
    password: ${AGENT_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${AGENT_DB_POOL_MAX:10}
      minimum-idle:      ${AGENT_DB_POOL_MIN:2}
      connection-timeout: 30000
      idle-timeout:       600000
      max-lifetime:       1800000
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration/postgres
    # Postgres supports transactional DDL.
    group: true
    out-of-order: false

management:
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,db,llmProvider
