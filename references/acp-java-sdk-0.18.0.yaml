holds:
  - build.gradle resolves com.agentclientprotocol:acp-agent-support:0.18.0 for Penstock's --acp mode
  - offers an annotation-based agent style (@AcpAgent, @Initialize, @NewSession, @Prompt, @Cancel) that Penstock's AcpMode uses directly
  - ships a stdio transport (StdioAcpAgentTransport) that AcpStdioRunner builds the agent's transport on
  - AcpAgentSupport.run() blocks until the client disconnects (closes stdin)
