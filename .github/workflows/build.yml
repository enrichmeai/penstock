name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        java: [21]

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Bootstrap Gradle wrapper (if missing)
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            chmod +x ./bootstrap.sh
            ./bootstrap.sh
          fi

      - name: Build + test
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon build

      - name: Fetch tags
        # actions/checkout is shallow and tagless. check-cards.sh's STALE rule needs the newest
        # release tag (#81) and test-promote-pattern.sh walks v0.1.0..v0.3.0 (#77).
        run: git fetch --quiet --tags --unshallow origin || git fetch --quiet --tags origin

      - name: Check project memory (requests/, references/, patterns/)
        # Every card parses, every id resolves, every pattern's check.sh passes (#72); every
        # manifest names a verified-against.tag, and one behind the newest release warns STALE (#81).
        run: bash scripts/check-cards.sh

      - name: Check the staleness rules themselves (scripts/test-check-cards.sh)
        # Five fixture repos under scripts/test/cards/: null tag fails, older tag warns, no tags
        # skips visibly, a malformed manifest is reported without aborting, the seed passes (#81).
        run: bash scripts/test-check-cards.sh

      - name: Check the episode drafter's guards (scripts/test-write-episode.sh)
        # Offline, in a scratch repo: markers are harvested, a credential-shaped line is refused
        # with exit 2 and nothing written, --out stays inside episodes/, no overwrite without
        # --replace, bad slug/project/range exit 64 (#86).
        run: bash scripts/test-write-episode.sh

      - name: Check consolidation and recall (scripts/test-facts.sh)
        # Offline, in a scratch repo: new / confirm / supersede proposals, --write guards, the
        # credential refusal, and fact.sh's matching and exit codes (#87).
        run: bash scripts/test-facts.sh

      - name: Check memory publish and grants (scripts/test-memory-publish.sh)
        # Offline, with a fake cistern CLI on PATH: the sync plan for a flat and a sectioned root,
        # exit codes, one-time provisioning, and the --project grant and revoke paths (#91).
        run: bash scripts/test-memory-publish.sh

      - name: Check pattern promotion (scripts/promote-pattern.sh)
        # Regenerates the seed pattern in --dry-run and asserts the overlap; proves the
        # credential refusal writes nothing (#77). GH_TOKEN lets the script read the issue;
        # without it the script continues with an empty issue and says so.
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/test-promote-pattern.sh

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-jdk${{ matrix.java }}
          path: |
            build/reports/tests/test
            build/test-results/test
          retention-days: 7

      - name: Upload jar
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: penstock-jar
          path: build/libs/*.jar
          retention-days: 7
