name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # A PR's runs cancel each other; every push to main runs to the end in a group of its own, so
  # each merged commit gets its sha-<commit> image and artifacts (#150). Two main runs may finish
  # out of order and leave :main on the older commit: consumers resolve by sha-<commit>, never :main.
  group: build-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        java: [21]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Bootstrap Gradle wrapper (if missing)
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            chmod +x ./bootstrap.sh
            ./bootstrap.sh
          fi

      - name: Build + test
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon build

      - name: Fetch tags
        # actions/checkout is shallow and tagless. check-cards.sh's STALE rule needs the newest
        # release tag (#81) and test-promote-pattern.sh walks v0.1.0..v0.3.0 (#77).
        run: git fetch --quiet --tags --unshallow origin || git fetch --quiet --tags origin

      - name: Check project memory (requests/, references/, patterns/)
        # Every card parses, every id resolves, every pattern's check.sh passes (#72); every
        # manifest names a verified-against.tag, and one behind the newest release warns STALE (#81).
        run: bash scripts/check-cards.sh

      - name: Check the staleness rules themselves (scripts/test-check-cards.sh)
        # Five fixture repos under scripts/test/cards/: null tag fails, older tag warns, no tags
        # skips visibly, a malformed manifest is reported without aborting, the seed passes (#81).
        run: bash scripts/test-check-cards.sh

      - name: Check the episode drafter's guards (scripts/test-write-episode.sh)
        # Offline, in a scratch repo: markers are harvested, a credential-shaped line is refused
        # with exit 2 and nothing written, --out stays inside episodes/, no overwrite without
        # --replace, bad slug/project/range exit 64 (#86).
        run: bash scripts/test-write-episode.sh

      - name: Check consolidation and recall (scripts/test-facts.sh)
        # Offline, in a scratch repo: new / confirm / supersede proposals, --write guards, the
        # credential refusal, and fact.sh's matching and exit codes (#87).
        run: bash scripts/test-facts.sh

      - name: Check memory publish and grants (scripts/test-memory-publish.sh)
        # Offline, with a fake cistern CLI on PATH: the sync plan for a flat and a sectioned root,
        # exit codes, one-time provisioning, and the --project grant and revoke paths (#91).
        run: bash scripts/test-memory-publish.sh

      - name: Check the one-command start (scripts/test-start.sh)
        # Offline, in a scratch HOME with stub curl, java and claude: the jar is checked against the
        # release digest and refused on a mismatch, the memory root is created or extended and passes
        # check-cards.sh, the server is registered once, a re-run changes nothing, and run as
        # `curl | sh` no command swallows the script (#147).
        run: bash scripts/test-start.sh </dev/null

      - name: Check pattern promotion (scripts/promote-pattern.sh)
        # Regenerates the seed pattern in --dry-run and asserts the overlap; proves the
        # credential refusal writes nothing (#77). GH_TOKEN lets the script read the issue;
        # without it the script continues with an empty issue and says so.
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/test-promote-pattern.sh

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-jdk${{ matrix.java }}
          path: |
            build/reports/tests/test
            build/test-results/test
          retention-days: 7

      - name: Upload jar
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: penstock-jar
          # The boot jar only: the plain jar is not a release asset.
          path: |
            build/libs/*.jar
            !build/libs/*-plain.jar
          # 90 days on main: products' release workflow takes the jar from the commit it releases (#150).
          retention-days: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 90 || 7 }}

  # #150: on every merge to main, publish the image this commit builds, tagged by commit, so
  # enrichmeai/products can test it with Cistern and release it later by retagging the same digest
  # (products#11). Nothing here tags or releases: release.yml still does that until products
  # has made one release, then it is retired. A PR never pushes.
  image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Version from source
        # build.gradle's default version, as the source states it: the last release's until a PR moves
        # it to the next one. The image carries it as a label, so products can refuse to release a
        # commit whose source does not say the version it is released as (products#11).
        run: |
          VERSION=$(sed -n "s/^version = findProperty('releaseVersion') ?: '\(.*\)'$/\1/p" build.gradle)
          [ -n "$VERSION" ] || { echo "::error::no default version in build.gradle"; exit 1; }
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "SHA_TAG=sha-${GITHUB_SHA}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build amd64 image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test — image must boot exactly as shipped
        # The same check release.yml runs: no env overrides, so the as-shipped default (memory mode).
        run: |
          docker run -d --name smoke -p 18080:8080 "${IMAGE}:smoke"
          ok=""
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:18080/api/health > /dev/null; then ok=1; break; fi
            sleep 2
          done
          echo "--- container log tail ---"
          docker logs smoke 2>&1 | tail -25
          docker rm -f smoke
          [ "$ok" = "1" ] || { echo "image failed to become healthy"; exit 1; }

      - name: Push multi-arch image (sha-<commit>, main)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.SHA_TAG }}
            ${{ env.IMAGE }}:main
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: SBOM (CycloneDX) for the pushed image
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}:${{ env.SHA_TAG }}
          format: cyclonedx-json
          output-file: sbom-${{ env.VERSION }}.cdx.json

      - name: Trivy vulnerability report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.SHA_TAG }}
          format: table
          output: trivy-report-${{ env.VERSION }}.txt
          severity: HIGH,CRITICAL
          exit-code: '0'

      - name: Upload the release assets for this commit
        # The files release.yml attaches to a release, minus the jar (the build job uploads it as
        # penstock-jar). products' release workflow downloads both from this run.
        uses: actions/upload-artifact@v7
        with:
          name: penstock-release-assets
          path: |
            sbom-${{ env.VERSION }}.cdx.json
            trivy-report-${{ env.VERSION }}.txt
            scripts/start.sh
          retention-days: 90
