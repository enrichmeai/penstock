# Claude builds; the reviewer agent verifies; the owner merges (CLAUDE.md § "Autonomous build loop").
# The same loop runs in enrichmeai/cistern; each repo's workflow is shaped to its own build.
#
# Trigger: a comment that STARTS with "@claude" on an issue or PR, or the `claude` label on an issue,
# and only when the actor is the owner's account, so nobody else can start a run.
#
# What this workflow can NOT do, by construction:
#   - publish anything: no `packages: write`, so it cannot push to ghcr.io; tags and releases are
#     refused by the tool list below, and a v* tag is what starts release.yml.
#   - edit workflows: GITHUB_TOKEN has no `workflows` permission, so a push that changes
#     .github/workflows/ is refused by GitHub.
#   - hold an LLM provider key: no provider secret is passed, so the app's own tests run on stubs
#     exactly as in build.yml.
#   - run two at once: one concurrency group per repository, never cancelled mid-run.
#
# Tools: the action does NOT read .claude/settings.json permissions; it passes its own short list
# (read, search, git add/commit/push/rm) and disallows WebFetch. Without --allowedTools below the
# builder cannot run Gradle, fetch the pinned docs, or run the hook tests (found on cistern#64,
# run 36328499745: 117/120 turns, 18 denials, nothing pushed). The guard hook in .claude/hooks
# still runs on every Bash call; --disallowedTools still wins (bootRun stays refused).
#
# Note: pushes made with GITHUB_TOKEN do not start other workflows. CI runs when the owner's
# account opens the PR from Claude's branch, and on later pushes by closing and reopening the PR.
# (Docs: code.claude.com/docs/en/github-actions § "CI not running on Claude's commits".)
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: claude-${{ github.repository }}
  cancel-in-progress: false

jobs:
  claude:
    # Both the actor AND the author of the issue or PR must be the owner: the action puts the
    # issue/PR body into Claude's context, so an owner comment on someone else's issue must not
    # carry that body into a run with contents: write.
    if: >-
      github.actor == 'josepharuja' &&
      (github.event.issue.user.login == 'josepharuja' || github.event.pull_request.user.login == 'josepharuja') && (
        (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && startsWith(github.event.comment.body, '@claude')) ||
        (github.event_name == 'issues' && github.event.label.name == 'claude')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Java 21, as build.yml builds it.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # gradle-wrapper.jar is deliberately not in the repo, and Claude's tool list refuses curl,
      # so the wrapper is fetched here, before Claude starts. bootstrap.sh also regenerates the
      # gradlew scripts; restoring the tracked ones keeps that churn out of Claude's diff.
      - name: Bootstrap Gradle wrapper
        run: |
          chmod +x ./bootstrap.sh
          ./bootstrap.sh
          git checkout -- gradlew gradlew.bat
          chmod +x ./gradlew

      # Pinned to the commit behind the v1 tag on 2026-09-24 (the same pin as the valuedocs repos):
      # a third-party action that receives a write token is pinned by SHA, not by a movable tag.
      - uses: anthropics/claude-code-action@fd1c128679612beff4ca259c78021c506e8aa7a7 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The workflow token, not the Claude GitHub App: the App path needs id-token: write.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          label_trigger: claude
          include_comments_by_actor: josepharuja
          branch_prefix: claude/
          claude_args: >-
            --max-turns 200
            --allowedTools "Edit,Write,MultiEdit,Task,TodoWrite,WebFetch,Bash(./gradlew compileTestJava:*),Bash(./gradlew test:*),Bash(./gradlew build:*),Bash(./gradlew --no-daemon:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git fetch:*),Bash(git checkout:*),Bash(git switch:*),Bash(bash scripts/*),Bash(./scripts/*),Bash(bash .claude/hooks/test-hooks.sh),Bash(.claude/hooks/test-hooks.sh)"
            --disallowedTools "Bash(gh pr merge:*),Bash(gh workflow run:*),Bash(gh api:*),Bash(gh release:*),Bash(git tag:*),Bash(git push origin main:*),Bash(git push --tags:*),Bash(docker push:*),Bash(./gradlew bootRun:*),Bash(curl:*)"
            --append-system-prompt "You are the builder: Claude builds, the reviewer agent verifies, the owner merges. CLAUDE.md in this repository governs everything you do; follow the /build-task skill (verify external APIs against the pinned docs first, red then green as in redgreen-fix, run the reviewer agent before replying, at most 3 fix attempts then a Blocker summary, then /compound). Commit and push work in progress after the first green test and after each reviewer round, so a run that ends early loses nothing. Run the reviewer agent in the foreground and wait for its verdict; never end your turn while any agent or background task is still running, because the run ends when you stop. Work only on the task in the triggering issue or comment; if it is ambiguous, reply with the question and stop. One branch per task. Prove every behaviour change red first, then green, and quote both. Every commit is DCO signed off (git commit -s) with a conventional message and carries no AI co-author trailer. A failing test is questioned before production code is changed to satisfy it. Never relax a test, never widen a permission or the sandbox, never merge, tag, publish, dispatch a workflow, or touch .github/workflows. You have no provider keys and no cloud access: anything that needs a real LLM, a running pod, or a release, write it down as an owner action and stop. End every reply with: branch, head SHA, files changed, tests run with their result, and anything left for the owner."

      # The builder is told to push work in progress, but a prompt is not a guarantee: on cistern#64
      # (run 36330278834) it ended its turn while a background reviewer agent was still running, and
      # 35 minutes of green work was never pushed. This step makes saving mechanical: whatever the
      # builder left on its claude/ branch, committed or not, is pushed there. It never touches any
      # other branch.
      - name: Save the builder's work if it stopped before pushing
        if: always()
        run: |
          branch=$(git rev-parse --abbrev-ref HEAD)
          case "$branch" in
            claude/*) ;;
            *) echo "on '$branch', not a claude/ branch: nothing to save"; exit 0 ;;
          esac
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -q -s -m "wip(claude): save unpushed work from run ${GITHUB_RUN_ID}"
          fi
          remote=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          if [ "$remote" = "$(git rev-parse HEAD)" ]; then echo "nothing to save: origin/$branch is up to date"; exit 0; fi
          if [ "$(git rev-list --count origin/main..HEAD 2>/dev/null || echo 1)" = "0" ]; then echo "no commits beyond main: nothing to save"; exit 0; fi
          git push origin "HEAD:refs/heads/$branch"
          echo "saved $(git rev-parse --short HEAD) to $branch"
