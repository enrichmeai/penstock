# Release pipeline: push a tag like v0.1.0 and this
#   1. builds + tests the jar (version taken from the tag),
#   2. builds the amd64 image and smoke-tests it (boots in default memory
#      mode, polls /api/health) BEFORE anything is published,
#   3. pushes a multi-arch (amd64 + arm64) image to GHCR as :<version> and
#      :latest — the build stage is pinned to the builder platform in the
#      Dockerfile, so the test suite runs once natively, never under QEMU,
#   4. generates a CycloneDX SBOM and a Trivy vulnerability report for the
#      published image,
#   5. creates a GitHub Release with generated notes, the jar, the SBOM,
#      and the scan report attached.
#
# Note: Trivy reports but does not gate (exit-code 0) — revisit once a
# vulnerability baseline exists for the temurin base image.

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag (v0.1.0 -> 0.1.0)
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Bootstrap Gradle wrapper if missing
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            chmod +x bootstrap.sh gradlew && ./bootstrap.sh
          fi

      - name: Build and test
        run: ./gradlew --no-daemon build -PreleaseVersion="${VERSION}"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build amd64 image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test — image must boot exactly as shipped
        run: |
          # No env overrides: neither the Dockerfile nor the entrypoint sets
          # AGENT_STORAGE_TYPE, so this exercises the true as-shipped default
          # (memory mode — the issue #12 startup path) the way a bare
          # `docker run` from the README does.
          docker run -d --name smoke -p 18080:8080 "${IMAGE}:smoke"
          ok=""
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:18080/api/health > /dev/null; then ok=1; break; fi
            sleep 2
          done
          echo "--- container log tail ---"
          docker logs smoke 2>&1 | tail -25
          docker rm -f smoke
          [ "$ok" = "1" ] || { echo "image failed to become healthy"; exit 1; }

      - name: Push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: SBOM (CycloneDX) for the published image
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}:${{ env.VERSION }}
          format: cyclonedx-json
          output-file: sbom-${{ env.VERSION }}.cdx.json

      - name: Trivy vulnerability report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.VERSION }}
          format: table
          output: trivy-report-${{ env.VERSION }}.txt
          severity: HIGH,CRITICAL
          exit-code: '0'

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            "build/libs/penstock-${VERSION}.jar" \
            "sbom-${VERSION}.cdx.json" \
            "trivy-report-${VERSION}.txt"
