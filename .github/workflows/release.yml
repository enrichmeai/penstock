# Release pipeline: push a tag like v0.1.0 (or run it from the Actions tab with
# a version, and it creates the tag at the end) and this
#   1. builds + tests the jar (version taken from the tag),
#   2. builds the amd64 image and smoke-tests it (boots in default memory
#      mode, polls /api/health) BEFORE anything is published,
#   3. pushes a multi-arch (amd64 + arm64) image to GHCR as :<version> and
#      :latest — the build stage is pinned to the builder platform in the
#      Dockerfile, so the test suite runs once natively, never under QEMU,
#   4. generates a CycloneDX SBOM and a Trivy vulnerability report for the
#      published image,
#   5. creates a GitHub Release with generated notes, the jar, the SBOM,
#      and the scan report attached.
#
# Note: Trivy reports but does not gate (exit-code 0) — revisit once a
# vulnerability baseline exists for the temurin base image.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.3.0 — the tag v<version> is created on the chosen branch'
        required: true
        type: string

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive version and tag
        # Tag push: v0.1.0 -> VERSION 0.1.0, TAG v0.1.0. Manual run: the version
        # input, and the tag is created by `gh release create --target` below,
        # after everything has been built, smoke-tested and pushed.
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            VERSION="${INPUT_VERSION#v}"
            TAG="v${VERSION}"
            if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
              echo "::error::tag ${TAG} already exists; push a new version or delete the tag first"
              exit 1
            fi
            echo "TARGET=--target=${GITHUB_SHA}" >> "$GITHUB_ENV"
          else
            VERSION="${GITHUB_REF_NAME#v}"
            TAG="${GITHUB_REF_NAME}"
            echo "TARGET=" >> "$GITHUB_ENV"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "TAG=${TAG}" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Bootstrap Gradle wrapper if missing
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            chmod +x bootstrap.sh gradlew && ./bootstrap.sh
          fi

      - name: Build and test
        run: ./gradlew --no-daemon build -PreleaseVersion="${VERSION}"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build amd64 image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test — image must boot exactly as shipped
        run: |
          # No env overrides: neither the Dockerfile nor the entrypoint sets
          # AGENT_STORAGE_TYPE, so this exercises the true as-shipped default
          # (memory mode — the issue #12 startup path) the way a bare
          # `docker run` from the README does.
          docker run -d --name smoke -p 18080:8080 "${IMAGE}:smoke"
          ok=""
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:18080/api/health > /dev/null; then ok=1; break; fi
            sleep 2
          done
          echo "--- container log tail ---"
          docker logs smoke 2>&1 | tail -25
          docker rm -f smoke
          [ "$ok" = "1" ] || { echo "image failed to become healthy"; exit 1; }

      - name: Push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: SBOM (CycloneDX) for the published image
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}:${{ env.VERSION }}
          format: cyclonedx-json
          output-file: sbom-${{ env.VERSION }}.cdx.json

      - name: Trivy vulnerability report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.VERSION }}
          format: table
          output: trivy-report-${{ env.VERSION }}.txt
          severity: HIGH,CRITICAL
          exit-code: '0'

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Hand-written notes for this version, when present, go first; the
          # API prepends them to the generated "What's Changed" list.
          notes=()
          if [ -f "docs/releases/${TAG}.md" ]; then
            notes=(--notes-file "docs/releases/${TAG}.md")
          fi
          # ${TARGET} is empty on a tag push; on a manual run it is
          # --target=<sha>, which makes GitHub create the tag at that commit.
          gh release create "${TAG}" ${TARGET} \
            --title "${TAG}" \
            --generate-notes "${notes[@]}" \
            "build/libs/penstock-${VERSION}.jar" \
            "sbom-${VERSION}.cdx.json" \
            "trivy-report-${VERSION}.txt"
